{% extends 'layouts.html' %}


{% block content %}
<section class="py-5">
	<div class="position-relative py-5">
		<div class="position-absolute"><img alt="" class="img-fluid" src="https://freefrontend.dev/assets/map-img-4.png"></div>
		<div class="position-relative">
			<div class="container">
				<div class="row justify-content-end">
					<div class="col-lg-6">
						<div class="bg-white p-5 rounded shadow mt-5">
							<h2 class="display-6 fw-bold text-center mb-4">Register a new account</h2>
							<form method="post">
								{% csrf_token %}
								<div class="row">
									<div class="col-md-12">
                                        <h4 class="text-center">Create an account</h4><hr>
										{% for message in messages %}
							             <div class="alert {{ message.tags }} alert-dismissible" role="alert">
                                          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                           <span aria-hidden="true">&times;</span>
                                         </button>
                                         {{ message }}
                                         </div>
                                        {% endfor %}
										<div class="mb-3">
											<input type="text" name="name" class="form-control bg-light" id="name" placeholder="Full Name">
										</div>
                                        <div class="mb-3">
											<input type="username" name="username" class="form-control bg-light" id="username" placeholder="Username">
										</div>
                                        <div class="mb-3">
											<input type="password" name="password" class="form-control bg-light" id="password" placeholder="Password">
										</div>
                                        <div class="mb-3">
											<input type="password" name="confirm_password" class="form-control bg-light" id="confirm_password" placeholder="Confirm Password">
										</div>
									</div>
									
									<div class="col-md-12">
										
									</div>
									</div>
								</div>
							    <div class="d-grid">
							    <button class="btn btn-primary" type="submit">Register</button>
								</div>	
							</form>
							<div class="mb-3 text-center">
							</div>
							<div class="text-center mb-3">
								<small>Already have an account<a href="{% url 'login' %}">Login !</a></small>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
{% endblock %}
