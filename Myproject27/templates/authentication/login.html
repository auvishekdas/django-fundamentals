{% extends 'layouts.html' %}


{% block content %}
<section class="py-5">
	<div class="position-relative py-5">
		<div class="position-absolute"><img alt="" class="img-fluid" src="https://freefrontend.dev/assets/map-img-4.png"></div>
		<div class="position-relative">
			<div class="container">
				<div class="row justify-content-end">
					<div class="col-lg-6">
						<div class="bg-white p-5 rounded shadow mt-5">
							<h2 class="display-6 fw-bold text-center mb-4">Login Your Account</h2>
							<form method="post">
								{% csrf_token %}
								<div class="row">
									<div class="col-md-12">
										<div class="mb-3">
											<input type="text" name="username" class="form-control bg-light" placeholder="Username">
										</div>
									</div>
									<div class="col-md-12">
										<div class="mb-3">
											<input type="password" name="password" class="form-control bg-light" placeholder="Password"> 
										</div>
									</div>
									<div class="col-md-12">
										
									</div>
									<div class="col-md-5">
										<div class="d-grid">
											<button class="btn btn-primary" type="submit">Login</button>
										</div>
									</div>
								</div>
							</form>
							<div class="mb-3 text-center">
								<small>Forgot my <a href="{% url 'forgotpassword' %}">password!</a></small>
							</div>
							<div class="text-center mb-3">
								<small>Don't have an account <a href="{% url 'registration' %}">Register Now !</a></small>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
{% endblock %}
