{% extends 'layouts.html' %}


{% block content %}
<section class="py-5">
	<div class="position-relative py-5">
		<div class="position-absolute"><img alt="" class="img-fluid" src="https://freefrontend.dev/assets/map-img-4.png"></div>
		<div class="position-relative">
			<div class="container">
				<div class="row justify-content-end">
					<div class="col-lg-6">
						<div class="bg-white p-5 rounded shadow mt-5">
							<h2 class="display-6 fw-bold text-center mb-4">Contact Us</h2>
							<form method="post">
								{% csrf_token %}
								<div class="row">
									<div class="col-md-12">
										<div class="mb-3">
											<input type="text" name="name" class="form-control bg-light" placeholder="Your name">
										</div>
									</div>
									<div class="col-md-12">
										<div class="mb-3">
											<input type="email" name="email" class="form-control bg-light" placeholder="Your email"> 
										</div>
									</div>
									<div class="col-md-12">
										<div class="mb-3">
											<textarea name="message" class="form-control bg-light" placeholder="Your message"></textarea>
										</div>
									</div>
									<div class="col-md-5">
										<div class="d-grid">
											<button class="btn btn-primary" type="submit">Send message</button>
										</div>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
{% endblock %}
